name: build-and-deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - '**/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# defaults:
#   run:
#     working-directory: webapp

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        # Nitro's node-server output is self-contained (no node_modules needed):
        #   .output/server/index.mjs  +  .output/public/
        # gueterbahnhof entry command for such an app: `node server/index.mjs`

      - name: Deploy to gueterbahnhof
        uses: romanlamsal/gueterbahnhof/action@main
        with:
          host: https://gueterbahnhof.lamsal.de
          app_name: TODO
          path: .output
          api_key: ${{ secrets.GUETERBAHNHOF_API_KEY }}
